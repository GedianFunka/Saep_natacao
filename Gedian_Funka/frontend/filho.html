<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filhos</title>
</head>
<body>
    
    <h1>Gerenciamento de Filhos</h1>
    <button onclick="voltar()">Voltar</button>
    <button onclick="logout()">Logout</button>
    <hr>    

    <!--Formulario-->
    <label>Filho</label>
    <select id="id_filho">
        <option value="">Selecione o Filho</option>
    </select>

    <label>Nome</label>
    <input type="text" id="nome"><br><br>

    <label>Responsavel</label>
    <input type="text" id="id_responsavel"><br><br>

    <label>Data de Nascimento</label>
    <input type="date" id="data_nascimento"><br><br>

    <select id="nivel_natacao">
        <option value="">Selecione o nivel de natacao</option>
        <option value="iniciante">Iniciante</option>
        <option value="intermediario">Intermediario</option>
        <option value="avancado">Avancado</option>
    </select>
    
    <button onclick="cadastrar()">Cadastrar</button>
    <hr>

    <!--Scripts-->
    <script src="api.js"></script>
    <script src="sessao.js"></script>
    <script src="responsavel.js"></script>

</body>
</html>
